services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=td7
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8.0
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=td7
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"

volumes:
  mongodb_data:
