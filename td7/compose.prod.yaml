services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    environment:
      - PORT=80
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=td7
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"

  reverse-proxy:
    restart: always
    build:
      context: reverse-proxy/
      dockerfile: ./Dockerfile.dev
    depends_on:
      - api
      - frontend
    volumes:
      - ./reverse-proxy/log:/var/log/nginx
    ports:
      - 80:80

  mongodb:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_DATABASE=td7
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8-alpine

volumes:
  mongodb_data:
