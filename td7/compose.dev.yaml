services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=td7
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./api/src:/app/src
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  reverse-proxy:
    restart: always
    build:
      context: reverse-proxy/
      dockerfile: ./Dockerfile.dev
    depends_on:
      - api
      - frontend
    volumes:
      - ./reverse-proxy/log:/var/log/nginx
    ports:
      - 80:80

  mongodb:
    image: mongo:8.0
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=td7
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8-alpine
    ports:
      - "6380:6379"

volumes:
  mongodb_data: