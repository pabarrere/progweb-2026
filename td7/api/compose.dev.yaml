services:
  api:
    build:
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - PORT=80
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=td7
    volumes:
      - ./src:/app/src
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_DATABASE=td7
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
